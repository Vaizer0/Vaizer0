name: Sync Projects

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch: {} # manual "Run workflow" button

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Regenerate projects table
        run: python3 scripts/sync-readme.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No changes — README is already in sync"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: sync projects table with live repos"
            git push
            echo "Pushed updated README"
          fi
